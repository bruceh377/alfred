name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr close "$PR" --comment "Thanks, but this repo does not accept pull requests (see CONTRIBUTING.md). Please open an issue instead."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
